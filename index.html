*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--ink)}

.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}

.brand{font-weight:800;font-size:22px;color:var(--navy)}.loginbox h2{margin:8px 0 4px}

.top strong{font-size:17px}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 60px)}
aside{background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}
.navgroup{font-size:11px;color:#8190a0;font-weight:800;margin:16px 8px 6px;text-transform:uppercase}
.nav{display:block;width:100%;text-align:left;background:transparent;color:#34465a;padding:10px;border-radius:8px;font-weight:600;margin:2px 0}
.nav:hover,.nav.active{background:#e9f3fc;color:#075b9c}
main{padding:22px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}
.metric{font-size:27px;font-weight:800;color:var(--blue);margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:260px}

td button{padding:6px 9px;font-size:12px}.empty{text-align:center;padding:28px;color:#718094}
#modal{position:fixed;inset:0;background:#10243a88;display:grid;place-items:center;padding:14px;z-index:10}
.modalbox{background:white;border-radius:14px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:20px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172b40;color:white;padding:11px 18px;border-radius:9px;z-index:20;display:none;max-width:90%}

 $('sidebar').querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>openTable(b.dataset.table));
 $('sidebar').querySelector('[data-home]').onclick=()=>{currentTable=null;buildNav();dashboard()};
}

 else{
  const {data:m,error:me}=await db.from('hospital_members').select('hospital_id,role,status,hospitals(name)').eq('user_id',user.id).eq('status','active').limit(1).maybeSingle();
  if(me)throw me;if(!m)throw new Error('এই অ্যাকাউন্টে কোনো সক্রিয় হাসপাতাল সদস্যপদ নেই। Super Admin-কে Hospital Admin access দিতে বলুন।');
  if(m.role!=='hospital_admin')throw new Error('এই প্যানেলে আপাতত Hospital Admin role প্রয়োজন।');
  role='hospital_admin';hospitalId=m.hospital_id;hospitalName=m.hospitals?.name||'হাসপাতাল';
 }
 $('who').textContent=(p?.full_name||user.email)+' · '+(role==='super_admin'?'Super Admin':hospitalName);
 $('login').classList.add('hidden');$('app').classList.remove('hidden');currentTable=null;buildNav();dashboard();
}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='লগইন হচ্ছে...';try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await initSession(data.session);}catch(err){$('loginMsg').textContent=err.message||'লগইন ব্যর্থ';}};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
db.auth.getSession().then(({data})=>{if(data.session)initSession(data.session).catch(e=>toast(e.message));});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){ $('app').classList.add('hidden');$('login').classList.remove('hidden');}});
async function count(table){let q=db.from(table).select('*',{count:'exact',head:true});if(hospitalId)q=q.eq('hospital_id',hospitalId);const {count,error}=await q;if(error)throw error;return count||0}
async function dashboard(){
 currentTable=null;setTitle('ড্যাশবোর্ড',hospitalName);$('addBtn').classList.add('hidden');
 const list=role==='super_admin'?['hospitals']:['doctors','patients','appointments','staff','lab_orders','medicines','admissions','invoices'];
 $('content').innerHTML='<div class="cards">'+list.map(t=>`<div class="card"><div class="muted">${configs[t].label}</div><div class="metric" id="m_${t}">…</div></div>`).join('')+'</div><div class="panel"><h2>সিস্টেম নির্দেশনা</h2><p class="muted">বাম পাশের মডিউল থেকে তথ্য যোগ, দেখা, সম্পাদনা ও মুছে ফেলতে পারবেন। আপনার অ্যাকাউন্টের Supabase RLS নীতিমালা অনুযায়ী ডেটা নিয়ন্ত্রিত হবে।</p><div class="notice">গুরুত্বপূর্ণ: Pharmacy stock_qty এখন ওষুধের রেকর্ডে ম্যানুয়ালি আপডেট হয়। Purchase/Sale এন্ট্রি নিজে থেকে স্টক বাড়ায় বা কমায় না। পূর্ণ stock ledger ও atomic billing চালুর জন্য পরবর্তী ধাপে database transaction function প্রয়োজন।</div></div>';
 for(const t of list){try{$('m_'+t).textContent=await count(t)}catch(e){$('m_'+t).textContent='—'}}
}
function openTable(t){if(!allowedTables().includes(t))return;currentTable=t;currentConfig=configs[t];buildNav();$('addBtn').classList.remove('hidden');setTitle(currentConfig.label,hospitalName);loadRows();}
async function loadRows(){
 $('content').innerHTML='<div class="panel">তথ্য লোড হচ্ছে...</div>';
 let q=db.from(currentTable).select('*').order('created_at',{ascending:false}).limit(300);
 if(hospitalId)q=q.eq('hospital_id',hospitalId);
 const {data,error}=await q;
 if(error){$('content').innerHTML=`<div class="notice">তথ্য আনা যায়নি: ${esc(error.message)}</div>`;return;}
 currentRows=data||[];renderRows();
}
function renderRows(filter=''){
 const cfg=currentConfig, cols=cfg.fields.map(f=>f[0]).filter(c=>currentRows.some(r=>c in r));
 const search=filter.toLowerCase();
 const rows=currentRows.filter(r=>!search||cfg.search.some(k=>String(r[k]??'').toLowerCase().includes(search)));
 let html=`<div class="toolbar" style="margin-bottom:10px"><input id="searchRows" placeholder="তথ্য খুঁজুন..." value="${esc(filter)}"><span class="muted small">${rows.length} টি রেকর্ড (সর্বোচ্চ ৩০০)</span><button class="secondary" id="refreshRows">রিফ্রেশ</button></div><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(cfg.fields.find(f=>f[0]===c)?.[1]||c)}</th>`).join('')}<th>কার্যক্রম</th></tr></thead><tbody>`;
 if(!rows.length)html+=`<tr><td class="empty" colspan="${cols.length+1}">কোনো তথ্য পাওয়া যায়নি</td></tr>`;
 rows.forEach(r=>{html+='<tr>'+cols.map(c=>`<td title="${esc(r[c])}">${esc(r[c])}</td>`).join('')+`<td class="actions">${currentTable==='hospitals'?`<button class="teal" data-admin="${r.id}">Admin তৈরি</button>`:''}<button class="secondary" data-edit="${r.id}">এডিট</button><button class="danger" data-del="${r.id}">ডিলিট</button></td></tr>`});
 html+='</tbody></table></div>';
 $('content').innerHTML=html;
 $('searchRows').oninput=e=>renderRows(e.target.value);
 $('refreshRows').onclick=loadRows;
 $('content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showForm(currentRows.find(r=>r.id===b.dataset.edit)));
 $('content').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRow(b.dataset.del));
 $('content').querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>createHospitalAdmin(b.dataset.admin));
}
function showForm(row=null){
 editingId=row?.id||null;$('modalTitle').textContent=editingId?'তথ্য সম্পাদনা':'নতুন '+currentConfig.label;
 let fields=currentConfig.fields.map(f=>{
  const [name,label,type,extra]=f;let value=row?.[name]??'';
  if(type==='textarea')return `<div style="grid-column:1/-1"><label>${esc(label)}</label><textarea name="${name}">${esc(value)}</textarea></div>`;
  if(type==='select')return `<div><label>${esc(label)}</label><select name="${name}"><option value="">নির্বাচন করুন</option>${extra.map(x=>`<option ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  let inputType=type==='uuid'?'text':type;
  if(type==='datetime-local'&&value)value=String(value).slice(0,16);
  return `<div><label>${esc(label)}${extra===1?' *':''}</label><input name="${name}" type="${inputType}" ${extra===1?'required':''} value="${esc(value)}" ${type==='uuid'?'placeholder="সম্পর্কিত রেকর্ডের UUID"':''}></div>`;
 }).join('');
 $('formFields').innerHTML=fields;$('modal').classList.remove('hidden');
}
function closeForm(){$('modal').classList.add('hidden');$('recordForm').reset();editingId=null}
$('closeModal').onclick=closeForm;$('cancelForm').onclick=closeForm;$('modal').onclick=e=>{if(e.target===$('modal'))closeForm()};
$('addBtn').onclick=()=>{if(currentTable)showForm()};
$('recordForm').onsubmit=async e=>{
 e.preventDefault();if(!currentTable)return;
 const form=new FormData(e.target),payload={};
 currentConfig.fields.forEach(f=>{const k=f[0],v=form.get(k);if(v!==null&&v!=='' ){let type=f[2];payload[k]=['number'].includes(type)?Number(v):v;}});
 if(hospitalId)payload.hospital_id=hospitalId;
 if(!editingId&&currentConfig.fields.some(f=>f[0]==='created_by'))payload.created_by=user.id;
 if(currentTable==='hospitals'&&!editingId)payload.created_by=user.id;
 if(currentTable==='hospital_members'&&!payload.status)payload.status='active';
 try{
  let result;
  if(editingId)result=await db.from(currentTable).update(payload).eq('id',editingId).select();
  else result=await db.from(currentTable).insert(payload).select();
  if(result.error)throw result.error;
  closeForm();toast('তথ্য সফলভাবে সংরক্ষিত হয়েছে');await loadRows();
 }catch(err){toast('সংরক্ষণ হয়নি: '+err.message)}
};
async function createHospitalAdmin(hid){
 const full_name=prompt('Hospital Admin-এর পূর্ণ নাম লিখুন:');if(!full_name)return;
 const email=prompt('Admin-এর ইমেইল লিখুন:');if(!email)return;
 const password=prompt('Admin-এর জন্য নতুন শক্তিশালী পাসওয়ার্ড দিন (কমপক্ষে ৮ অক্ষর):');if(!password)return;
 if(password.length<8){toast('পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে');return;}
 try{
  const {data:{session}}=await db.auth.getSession();
  const {data,error}=await db.functions.invoke('create-hospital-admin',{body:{hospital_id:hid,full_name,email,password},headers:{Authorization:'Bearer '+session.access_token}});
  if(error)throw error;
  toast('Hospital Admin তৈরি হয়েছে: '+email);
 }catch(err){toast('Admin তৈরি হয়নি: '+(err.message||'ত্রুটি'))}
}
async function deleteRow(id){
 if(!confirm('এই রেকর্ডটি মুছে ফেলতে চান?'))return;
 const {error}=await db.from(currentTable).delete().eq('id',id);
 if(error)toast('ডিলিট হয়নি: '+error.message);else{toast('রেকর্ড মুছে ফেলা হয়েছে');loadRows()}
}
})();
</script>
</body></html>
